events {
	worker_connections 1024;
}

http {
	include mime.types;

	server {
		listen 80;
		server_name instigi.com www.instigi.com;

		location / {
			proxy_pass http://web-app:80;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}

	server {
		listen 80;
		server_name admin.instigi.com;

		location / {
			proxy_pass http://admin-app:80;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}

	server {
		listen 80;
		server_name api.instigi.com;

		# Strips the /auth prefix before forwarding to auth-service
		location /auth/ {
			proxy_pass http://auth-service:4000/;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Authorization $http_authorization;
		}
	}

	server {
		listen 80;
		server_name pgadmin.instigi.com;

		location / {
			proxy_pass http://pgadmin:80;
		}
	}
}
