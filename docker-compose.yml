services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - postgres

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
    command: sh -c "node_modules/.bin/prisma migrate deploy && node dist/index.js"
    depends_on:
      postgres:
        condition: service_healthy

  web-app:
    build:
      context: .
      dockerfile: apps/web-app/Dockerfile
    restart: unless-stopped
    depends_on:
      - auth-service

  admin-app:
    build:
      context: .
      dockerfile: apps/admin-app/Dockerfile
    restart: unless-stopped
    depends_on:
      - auth-service

  caddy:
    image: caddy:latest
    restart: unless-stopped
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL}
      PGADMIN_BASIC_AUTH_USER: ${PGADMIN_BASIC_AUTH_USER}
      PGADMIN_BASIC_AUTH_HASH: ${PGADMIN_BASIC_AUTH_HASH}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web-app
      - admin-app
      - auth-service
      - pgadmin

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
