name: Test

on:
  push:
  pull_request:
    branches: [master]

# prisma.config.ts resolves env('DATABASE_URL') even for `prisma generate`,
# which runs during test/typecheck. A dummy value is enough — no DB connection
# is made during code generation.
env:
  DATABASE_URL: postgresql://user:password@localhost:5432/instigi?schema=public

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.3'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
